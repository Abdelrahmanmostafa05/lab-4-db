{% macro render_table(rows) -%}
  {% if rows %}
  <table>
    <thead>
      <tr>{% for column in rows[0].keys() %}<th>{{ column }}</th>{% endfor %}</tr>
    </thead>
    <tbody>
      {% for row in rows %}
      <tr>
        {% for value in row.values() %}
        <td>{% if value is none %}<i>NULL</i>{% else %}{{ value }}{% endif %}</td>
        {% endfor %}
      </tr>
      {% endfor %}
    </tbody>
  </table>
  {% else %}
  <p class="empty">No rows.</p>
  {% endif %}
{%- endmacro %}
